name: probe-dbt
on:
  workflow_run:
    workflows: [probe-run]
    types: [completed]
permissions: { contents: read, actions: read, statuses: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "actor=${{ github.actor }} triggering_actor=${{ github.triggering_actor }} run_actor=${{ github.event.workflow_run.actor.login }}"
          echo "secret_presente=${{ secrets.PROBE_SECRET != '' }}"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" -f state=success -f context=probe/dbt && echo "STATUS_SCRITTO" || echo "STATUS_NEGATO"
        env: { GH_TOKEN: "${{ github.token }}" }
