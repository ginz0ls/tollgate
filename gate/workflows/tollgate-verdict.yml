name: tollgate-verdict
on:
  workflow_run:
    workflows:
      - tollgate-run
    types:
      - completed
permissions:
  contents: read
  statuses: write
  pull-requests: write
  actions: read
  issues: read
jobs:
  tollgate-verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tollgate-run
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tollgate-run
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tollgate-base-ids
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tollgate-base-ids
      - name: albero di merge-base
        id: key
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags origin "$HEAD_SHA"
          mergebase=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")
          echo "tree=$(git rev-parse "$mergebase^{tree}")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.key.outputs.tree != ''
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
      - name: gate evaluate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tollgate/bin/tollgate gate evaluate --event "$GITHUB_EVENT_PATH" --artifacts "$RUNNER_TEMP/tollgate-run" --base-ids-cache "$RUNNER_TEMP/tollgate-ids/ids.json" --base-ids-artifact "$RUNNER_TEMP/tollgate-base-ids" --publish
