name: tollgate-sentinel
on:
  push:
    branches:
      - '__DEFAULT_BRANCH__'
permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: read
concurrency:
  group: tollgate-sentinel
  cancel-in-progress: false
jobs:
  tollgate-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: gate sentinel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tollgate/bin/tollgate gate sentinel --event "$GITHUB_EVENT_PATH" --publish
