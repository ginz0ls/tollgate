name: tollgate-base
on:
  push:
    branches:
      - __DEFAULT_BRANCH__
permissions:
  contents: read
  statuses: write
  issues: write
jobs:
  tollgate-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          fetch-depth: 0
      - name: albero del commit
        id: key
        run: echo "tree=$(git -C trusted rev-parse "$GITHUB_SHA^{tree}")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: base
          persist-credentials: false
      - name: gate base-ids
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tollgate/bin/tollgate gate base-ids --sha "$GITHUB_SHA" --root "$GITHUB_WORKSPACE/base" --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/tollgate-ids" --publish
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
