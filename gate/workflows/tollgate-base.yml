name: tollgate-base
on:
  push:
    branches:
      - '__DEFAULT_BRANCH__'
permissions:
  contents: read
  statuses: write
  issues: write
# Il job `ids` esegue la suite del progetto: sola lettura e nessun token. Il job `tollgate-base`
# pubblica gli stati e non esegue nulla del progetto. Dopo un push forzato che toglie $GITHUB_SHA
# dal ramo, `ids` o la pubblicazione possono fallire senza stato `tollgate/base`: la copre
# `tollgate-sentinel`.
jobs:
  ids:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # __SERVICES__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: albero del commit
        id: key
        run: echo "tree=$(git rev-parse "$GITHUB_SHA^{tree}")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
      - name: gate base-ids
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 .github/tollgate/bin/tollgate gate base-ids --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/tollgate-ids"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tollgate-ids
          path: ${{ runner.temp }}/tollgate-ids/ids.json
          if-no-files-found: ignore
  tollgate-base:
    needs: ids
    if: always()
    permissions:
      contents: read
      statuses: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tollgate-ids
          path: ${{ runner.temp }}/tollgate-ids
      - name: gate base-publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tollgate/bin/tollgate gate base-publish --ids "$RUNNER_TEMP/tollgate-ids" --event "$GITHUB_EVENT_PATH" --publish
