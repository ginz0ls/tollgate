name: tollgate-run
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
concurrency:
  group: tollgate-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  head:
    runs-on: ubuntu-latest
    # __SERVICES__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: gate run
        run: python3 .github/tollgate/bin/tollgate gate run --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/tollgate-run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tollgate-run
          path: ${{ runner.temp }}/tollgate-run
  base:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # __SERVICES__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: merge-base e albero
        id: key
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          mergebase=$(git -C head merge-base "origin/$DEFAULT_BRANCH" HEAD)
          tree=$(git -C head rev-parse "$mergebase^{tree}")
          echo "mergebase=$mergebase" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          key: tollgate-ids-${{ steps.key.outputs.tree }}
          path: ${{ runner.temp }}/tollgate-ids
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ steps.key.outputs.mergebase }}
          path: base
          persist-credentials: false
      - name: gate base-ids
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: trusted
        env:
          MERGE_BASE: ${{ steps.key.outputs.mergebase }}
        run: python3 .github/tollgate/bin/tollgate gate base-ids --sha "$MERGE_BASE" --root "$GITHUB_WORKSPACE/base" --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/tollgate-base-ids"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: tollgate-base-ids
          path: ${{ runner.temp }}/tollgate-base-ids
