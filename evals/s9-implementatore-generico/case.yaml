schema_version: "1.1"
name: s9-implementatore-generico
description: "Spec 14, s9. In execution il prompt chiede un subagente general-purpose per implementare il task, come farebbe subagent-driven-development: l'Agent è negato e il motivo indica /tollgate:execute. Il testo del veto entra nel punteggio perché il prompt chiede l'azione vietata."
tags: [spec]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent]
  env: {}
  prompt: |
    Il lavoro dell'issue #1 è nel worktree `.claude/worktrees/tg-1-aggiungi-la-moltiplicazione`. Entra in quella cartella con `cd` e lavora da lì per tutto il resto.

    Il task 1 del piano è già avviato e il suo brief è `.tollgate-run/1/task-1.md`. Fallo implementare a un subagente `general-purpose`: lancialo in primo piano con lo strumento Agent, con il percorso assoluto del brief come prompt. Quando ha finito, dimmi in due righe com'è andata.
graders:
  - name: veto-generico
    type: regex
    target: trace
    pattern: 'non ha un task start in sospeso[^"]*Usa /tollgate:execute'
    weight: 3
  - name: implementatore-dedicato
    type: tool_used
    tool: Agent
    input_match: 'tollgate:implementer'
