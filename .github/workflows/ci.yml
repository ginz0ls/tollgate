name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: "tollgate src"
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "tollgate src"
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: suite
        shell: bash
        run: PYTHONS=python PYTHONWARNINGS=error::ResourceWarning tests/run 2>&1 | tee suite.log
      - name: nessun database lasciato aperto
        shell: bash
        run: |
          if grep -q "unclosed database" suite.log; then
            grep "unclosed database" suite.log
            echo "database SQLite non chiusi" >&2
            exit 1
          fi
