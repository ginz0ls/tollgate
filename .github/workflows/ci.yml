name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: "tollgate src"
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: "tollgate src"
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: suite
        shell: bash
        run: PYTHONS=python PYTHONWARNINGS=error::ResourceWarning tests/run 2>&1 | tee suite.log
      - name: nessun database lasciato aperto
        shell: bash
        run: |
          if grep -q "unclosed database" suite.log; then
            grep "unclosed database" suite.log
            echo "database SQLite non chiusi" >&2
            exit 1
          fi
